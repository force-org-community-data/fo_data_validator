name: Force Org data validator
description: Checks a Force Org data source (shape, ids, references, stats and expressions).
branding:
    icon: check-circle
    color: gray-dark

inputs:
    source:
        description: Folder of the data source to check (holds forceorg.json).
        required: true
    extends:
        description: Optional folder of an extension source. Use when `source` is the base game and this folder extends it.
        required: false
        default: ''

runs:
    using: composite
    steps:
        - uses: actions/setup-node@v4
          with:
              node-version: 22
        - name: Install the validator
          shell: bash
          working-directory: ${{ github.action_path }}
          run: npm ci --omit=dev
        - name: Validate
          shell: bash
          env:
              SOURCE: ${{ inputs.source }}
              EXTENDS: ${{ inputs.extends }}
          run: |
              if [ -n "$EXTENDS" ]; then
                  node "$GITHUB_ACTION_PATH/bin/fo-validate.mjs" "$SOURCE" "$EXTENDS"
              else
                  node "$GITHUB_ACTION_PATH/bin/fo-validate.mjs" "$SOURCE"
              fi
